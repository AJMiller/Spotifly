# Publish a Developer ID–signed, notarized Spotifly.app as a GitHub Release
# on this repository (AJMiller/Spotifly) when a pull request is merged to main.
#
# Required secrets and Apple setup: docs/ci-macos-release.md
#
# Skip a merge: include [skip release] in the merge commit message.
# Manual run: Actions → Release → Run workflow.
# Homebrew cask updates are not published from this fork.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment when the project version is not already ahead of the latest tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit MARKETING_VERSION (e.g. 1.2.8). Must not match an existing v* tag.
        type: string
        required: false

concurrency:
  group: spotifly-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  LIBRESPOT_REPOSITORY: https://github.com/librespot-org/librespot.git
  # Known-good official librespot revision (CONTRIBUTING.md).
  LIBRESPOT_REF: 9c7d756
  PRODUCT_BUNDLE_IDENTIFIER: rvdh.Spotifly

jobs:
  release:
    name: Notarize and publish
    runs-on: macos-26
    timeout-minutes: 90
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && !startsWith(github.event.head_commit.message, 'chore(release):'))

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this push should release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_COMMIT_MESSAGE" == *"[skip release]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: merge commit contains [skip release]."
            exit 0
          fi
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'length')"
          if [[ "$count" -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${GITHUB_SHA} is not associated with a pull request (direct push to main)."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Associated pull request count: ${count}"

      - name: Check required secrets
        id: secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=(APPLE_TEAM_ID)
          [[ -n "${APPLE_DEVELOPER_CERTIFICATE_P12_BASE64}" ]] || missing+=(APPLE_DEVELOPER_CERTIFICATE_P12_BASE64)
          [[ -n "${APPLE_DEVELOPER_CERTIFICATE_PASSWORD}" ]] || missing+=(APPLE_DEVELOPER_CERTIFICATE_PASSWORD)
          [[ -n "${APPLE_API_KEY_ID}" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "${APPLE_API_ISSUER_ID}" ]] || missing+=(APPLE_API_ISSUER_ID)
          [[ -n "${APPLE_API_KEY_P8}" ]] || missing+=(APPLE_API_KEY_P8)
          if ((${#missing[@]})); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing/notarization secrets are not configured: ${missing[*]}"
            echo "See docs/ci-macos-release.md. This job succeeds without publishing so merges are not blocked."
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "workflow_dispatch requires those secrets; failing."
              exit 1
            fi
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Compute and write the next version
        id: version
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump || 'patch' }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          args=(--write --output github --pbxproj Spotifly.xcodeproj/project.pbxproj --bump "${INPUT_BUMP:-patch}")
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            args+=(--version "$INPUT_VERSION")
          fi
          scripts/ci/prepare-version.sh "${args[@]}"

      - name: Move changelog notes into the new version
        id: changelog
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/changelog-notes.md"
          scripts/ci/update-changelog.sh \
            --version "${{ steps.version.outputs.MARKETING_VERSION }}" \
            --print-notes >"$notes_file"
          echo "NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"

      - name: Refuse a duplicate tag or GitHub Release
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/assert-tag-free.sh "${{ steps.version.outputs.TAG }}" --repo "${{ github.repository }}"

      - name: Commit version and changelog
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Spotifly.xcodeproj/project.pbxproj CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.TAG }}"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Show Xcode version
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: xcodebuild -version

      - name: Install Rust and protobuf
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          rustup update --no-self-update stable
          rustup default stable
          rustup target add aarch64-apple-darwin
          brew list protobuf >/dev/null 2>&1 || brew install protobuf
          rustc --version
          cargo --version
          protoc --version

      - name: Check out official librespot (sibling of this repo)
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          librespot_dir="$(cd "${GITHUB_WORKSPACE}/.." && pwd)/librespot"
          mkdir -p "$librespot_dir"
          git -C "$librespot_dir" init
          git -C "$librespot_dir" remote add origin "${LIBRESPOT_REPOSITORY}"
          git -C "$librespot_dir" fetch --depth 1 origin "${LIBRESPOT_REF}"
          git -C "$librespot_dir" checkout FETCH_HEAD
          git -C "$librespot_dir" log --oneline -1
          test -d "$librespot_dir/core"
          echo "LIBRESPOT_DIR=${librespot_dir}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        id: signing
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: scripts/ci/import-signing-certificate.sh

      - name: Write App Store Connect API key
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          export KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["APPLE_API_KEY_P8"].replace("\r\n", "\n").strip()
          if "BEGIN" not in raw and "\\n" in raw:
              raw = bytes(raw, "utf-8").decode("unicode_escape")
          if not raw.endswith("\n"):
              raw += "\n"
          path = Path(os.environ["KEY_PATH"])
          path.write_text(raw)
          path.chmod(0o600)
          PY
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || {
            echo "APPLE_API_KEY_P8 does not look like a .p8 PEM"
            exit 1
          }
          echo "API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Write export options
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(
            --team-id "$APPLE_TEAM_ID"
            --out "${RUNNER_TEMP}/ExportOptions.plist"
            --bundle-id "${PRODUCT_BUNDLE_IDENTIFIER}"
          )
          if [[ -n "${{ steps.signing.outputs.PROVISIONING_PROFILE_SPECIFIER }}" ]]; then
            args+=(--profile-name "${{ steps.signing.outputs.PROVISIONING_PROFILE_SPECIFIER }}")
          fi
          scripts/ci/create-export-options.sh "${args[@]}"
          echo "EXPORT_OPTIONS=${RUNNER_TEMP}/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Archive Spotifly
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/Spotifly.xcarchive"
          extra=()
          if [[ -n "${{ steps.signing.outputs.PROVISIONING_PROFILE_SPECIFIER }}" ]]; then
            extra+=(
              CODE_SIGN_STYLE=Manual
              PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.PROVISIONING_PROFILE_SPECIFIER }}"
            )
          else
            extra+=(
              CODE_SIGN_STYLE=Automatic
              -allowProvisioningUpdates
              -authenticationKeyPath "${API_KEY_PATH}"
              -authenticationKeyID "${APPLE_API_KEY_ID}"
              -authenticationKeyIssuerID "${APPLE_API_ISSUER_ID}"
            )
          fi
          xcodebuild \
            -project Spotifly.xcodeproj \
            -scheme Spotifly \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -sdk macosx \
            -archivePath "$archive_path" \
            MARKETING_VERSION="${{ steps.version.outputs.MARKETING_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.CURRENT_PROJECT_VERSION }}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "${extra[@]}" \
            archive
          echo "ARCHIVE_PATH=${archive_path}" >> "$GITHUB_ENV"

      - name: Export Developer ID app
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export_path="${RUNNER_TEMP}/Spotifly-Export"
          extra=()
          if [[ -z "${{ steps.signing.outputs.PROVISIONING_PROFILE_SPECIFIER }}" ]]; then
            extra+=(
              -allowProvisioningUpdates
              -authenticationKeyPath "${API_KEY_PATH}"
              -authenticationKeyID "${APPLE_API_KEY_ID}"
              -authenticationKeyIssuerID "${APPLE_API_ISSUER_ID}"
            )
          fi
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "$export_path" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            "${extra[@]}"
          app_path="${export_path}/Spotifly.app"
          [[ -d "$app_path" ]] || { echo "exported Spotifly.app not found in ${export_path}"; ls -la "$export_path"; exit 1; }
          echo "APP_PATH=${app_path}" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          notary_zip="${RUNNER_TEMP}/Spotifly-notary.zip"
          ditto -c -k --keepParent "${APP_PATH}" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "${API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Zip the notarized app
        id: zip
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.MARKETING_VERSION }}"
          zip_name="Spotifly-${version}.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${GITHUB_WORKSPACE}/${zip_name}"
          sha256="$(shasum -a 256 "${zip_name}" | awk '{print $1}')"
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "SHA256 ${sha256}"

      - name: Push the version commit when main has not moved
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
            echo "Pushed chore(release) commit to main."
          else
            echo "main moved during the build; leaving MARKETING_VERSION on tag ${{ steps.version.outputs.TAG }} only."
            echo "The next release still increments from max(project, tags), so versions will not collide."
          fi

      - name: Push the version tag
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.TAG }}"
          git tag "$tag" "${{ steps.commit.outputs.release_sha }}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            echo "error: tag ${tag} appeared on origin while this job was running. Refusing to replace it."
            exit 1
          fi
          git push origin "$tag"

      - name: Publish the GitHub Release
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.TAG }}"
          version="${{ steps.version.outputs.MARKETING_VERSION }}"
          zip_name="${{ steps.zip.outputs.zip_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: GitHub Release ${tag} already exists. Refusing to replace it."
            exit 1
          fi
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## What's New"
            echo
            cat "${NOTES_FILE}"
            echo
            echo "## Download and Install"
            echo
            echo "1. Download \`${zip_name}\` from this release"
            echo "2. Extract it and move \`Spotifly.app\` to Applications"
            echo
            echo "This build is signed with Developer ID and notarized by Apple."
            echo
            echo "Homebrew cask updates are **not** published from this fork. SHA-256 of \`${zip_name}\`:"
            echo
            echo "\`${{ steps.zip.outputs.sha256 }}\`"
            echo
            echo "[Full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } >"$notes_file"
          gh release create "$tag" \
            "$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spotifly ${version}" \
            --notes-file "$notes_file" \
            --latest \
            --target "${{ steps.commit.outputs.release_sha }}"

      - name: Homebrew tap (skipped)
        if: steps.gate.outputs.skip != 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          echo "Homebrew cask updates target ralph/homebrew-spotifly and are not written from AJMiller/Spotifly."
          echo "Asset: ${{ steps.zip.outputs.zip_name }}"
          echo "SHA256: ${{ steps.zip.outputs.sha256 }}"

      - name: Delete the temporary signing keychain
        if: always() && steps.signing.outputs.KEYCHAIN_PATH != ''
        run: security delete-keychain "${{ steps.signing.outputs.KEYCHAIN_PATH }}" || true
